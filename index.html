</head>

    <div class="row"><span>زمین</span><input id="sl" type="range" step="0.001" aria-label="مقیاس"><span>مرز جهان</span></div>
    <div class="btns"><button id="go" type="button">سفر به پایان جهان</button><button id="home" type="button">بازگشت به زمین</button></div>
  </div>
</div>

      if (sunR > 6) { ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * .02); ctx.drawImage(SUNT, -sunR, -sunR, 2 * sunR, 2 * sunR); ctx.restore(); }
      else { ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(sx, sy, sunR, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1; label('خورشید', sx, sy - sunR * (sunR > 6 ? 1.5 : 1) - gz * .15 - 6, aP * ss(s, 10.5, 11.2)); }

    // "we are here" beacon
    const mA = ss(s, 13.6, 15.2); pj(E[0], E[1], 0);
    if (mA > .01) { ctx.strokeStyle = '#7cc4ff'; ctx.lineWidth = 1.4;
      for (let k = 0; k < 3; k++) { const p = (t * .5 + k / 3) % 1; ctx.globalAlpha = mA * (1 - p); ctx.beginPath(); ctx.arc(PX, PY, 5 + p * 34, 0, TAU); ctx.stroke(); }
      ctx.globalAlpha = mA; ctx.fillStyle = '#7cc4ff'; ctx.beginPath(); ctx.arc(PX, PY, 2.5, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; label('ما اینجاییم', PX, PY - 46, mA, '#9cd0ff'); }
  }

  function hud() {
    const li = LV.findIndex(l => s < l[0]);
    if (li !== lvI) { lvI = li; const h = document.querySelector('header'); h.style.opacity = 0; clearTimeout(lvT); lvT = setTimeout(() => { $('name').textContent = LV[li][1]; $('fact').textContent = LV[li][2]; h.style.opacity = 1; }, 260); }
    const m = Math.pow(10, s), [un, uv] = unit(m), sec = m / 3e8, lt = LT.find(x => sec < x[0]);
    $('view').textContent = 'پهنای کادر: ' + fa(m / uv) + ' ' + un + ' · نور این فاصله را در ' + fa(sec / lt[1]) + ' ' + lt[2] + ' می‌پیماید';
    const [bn, bm] = unit(mpp * 90), v = mpp * 90 / bm, p10 = Math.pow(10, Math.floor(Math.log10(v))), k = v / p10, nice = (k < 2 ? 1 : k < 5 ? 2 : 5) * p10;
    $('bar').style.width = nice * bm / mpp + 'px'; $('barL').textContent = fa(nice) + ' ' + bn;
    if (document.activeElement !== sl) sl.value = s;
  }

  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, .05); last = now; t += dt;
    if (auto) { sT = Math.min(SMAX, sT + dt * .42); if (sT >= SMAX) setAuto(false); }
    s += (sT - s) * (1 - Math.exp(-dt * 7));
    draw(); hud(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
