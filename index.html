    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
    ctx.drawImage(dayF[i], x - r, y - r, d, d); ctx.globalAlpha = fr; ctx.drawImage(dayF[j], x - r, y - r, d, d); ctx.globalAlpha = 1;
    const g = ctx.createLinearGradient(x + lx * r, y + ly * r, x - lx * r, y - ly * r);
    g.addColorStop(0, 'rgba(0,0,12,0)'); g.addColorStop(.5, 'rgba(0,0,12,.05)'); g.addColorStop(.78, 'rgba(0,0,12,.82)'); g.addColorStop(1, 'rgba(0,0,12,.96)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, d, d);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .9 * (1 - fr); ctx.drawImage(litF[i], x - r, y - r, d, d); ctx.globalAlpha = .9 * fr; ctx.drawImage(litF[j], x - r, y - r, d, d); ctx.restore();
    ctx.globalCompositeOperation = 'lighter'; const a = ctx.createRadialGradient(x, y, r * .96, x, y, r * 1.14);
    a.addColorStop(0, 'rgba(90,160,255,.5)'); a.addColorStop(1, 'rgba(90,160,255,0)'); ctx.fillStyle = a; ctx.beginPath(); ctx.arc(x, y, r * 1.14, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
  }

  function draw() {
    mpp = Math.pow(10, s) / W; hw = W / 2; hh = H / 2;
    const psi = -.35 + .22 * (s - SMIN) + t * .012, phi = .5 + .5 * ss(s, 18, 20.5) - .3 * ss(s, 22.5, 25);
    cps = Math.cos(psi); sps = Math.sin(psi); cp = Math.cos(phi); sp = Math.sin(phi);
    const eA = ang(2, t), E = [AU * Math.cos(eA), AU * Math.sin(eA)];
    let w = ss(s, 9.3, 10.6); ox = E[0] * (1 - w); oy = E[1] * (1 - w);
    w = ss(s, 19, 20.8); ox = L(ox, G[0], w); oy = L(oy, G[1], w);
    w = ss(s, 21.4, 22.6); ox = L(ox, A[0] / 2, w); oy = L(oy, A[1] / 2, w);
    w = ss(s, 23.6, 25); ox *= 1 - w; oy *= 1 - w;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const bgA = 1 - ss(s, 21, 23); if (bgA > .01) { ctx.fillStyle = '#fff'; BG.forEach(b => { ctx.globalAlpha = b[2] * bgA * (.4 + .2 * Math.sin(t * 2 + b[0] * 40)); ctx.fillRect(b[0] * W, b[1] * H, 1.2, 1.2); }); ctx.globalAlpha = 1; }
    ctx.font = '12px Vazirmatn, sans-serif'; ctx.textAlign = 'center'; ctx.globalCompositeOperation = 'lighter';

    pts(BELT, ss(s, 10.7, 11.7) * (1 - ss(s, 13, 14)) * .6, 1.1, '#c9b79c');
    pts(KB, ss(s, 11.8, 12.8) * (1 - ss(s, 14, 15)) * .6, 1.2, '#9bb');
    pts(OORT, ss(s, 13.5, 14.5) * (1 - ss(s, 17, 18.5)) * .6, 1.3, '#cde');
    const aL = ss(s, 15.5, 17) * (1 - ss(s, 19.3, 20.5)); pts(LOC, aL * .7, 1.3, '#dde8ff');

    const gv = [ss(s, 18.3, 20), ss(s, 19.5, 20.5) * (1 - ss(s, 24, 25)), ss(s, 19.5, 20.5) * (1 - ss(s, 24, 25))];
    GALS.forEach((g, i) => {
      pj(g.x, g.y, 0); const pr = g.R / mpp, v = gv[i]; if (v < .01 || PX < -pr * 2 - 60 || PX > W + pr * 2 + 60 || PY < -pr * 2 - 60 || PY > H + pr * 2 + 60) return;
      const pa = ss(pr, 14, 60) * v, sz = clamp(.9 + pr / 500, .9, 2.2);
      pts(g.s[0], pa * .8, sz, '#ffd9a0'); pts(g.s[1], pa * .75, sz, '#bcd6ff'); pts(g.s[2], pa * .7, sz + .4, '#ff9cc4');
      const gz = Math.max(g.R * 2.6 / mpp, 6); ctx.globalAlpha = v * .6 * (1 - ss(pr, 60, 400) * .75); ctx.drawImage(i ? GB : GO, PX - gz / 2, PY - gz / 2, gz, gz); ctx.globalAlpha = 1;
    });
    const sv = gv[1]; if (sv > .01) SAT.forEach(g => { pj(g.x, g.y, 0); const sz = Math.max(g.R * 2.4 / mpp, 3); if (PX > -sz && PX < W + sz && PY > -sz && PY < H + sz) { ctx.globalAlpha = sv * .8; ctx.drawImage(GB, PX - sz / 2, PY - sz / 2, sz, sz); ctx.globalAlpha = 1; } });
    const wA = ss(s, 22.4, 24.2); pts(WF, wA * .5, 1.1, '#9fb8ff'); pts(WC, wA * .8, 1.3, '#ffd6a8');
    if (wA > .01) NODES.forEach(n => { pj(n.x, n.y, n.z); const sz = Math.max(n.s * 12 / mpp, 6); if (PX > -sz && PX < W + sz && PY > -sz && PY < H + sz) { ctx.globalAlpha = wA * (n.n > 100 ? .5 : .22); ctx.drawImage(GO, PX - sz / 2, PY - sz / 2, sz, sz); ctx.globalAlpha = 1; } });
    ctx.globalCompositeOperation = 'source-over';

    NS.forEach(n => { pj(n.x, n.y, n.z); if (PX < 0 || PX > W || PY < 0 || PY > H) return; ctx.globalAlpha = aL; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(PX, PY, 2, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; label(n.n, PX, PY - 8, aL * .9); });
    GALS.forEach((g, i) => { pj(g.x, g.y, 0); const a = i === 0 ? ss(s, 20.2, 21) * (1 - ss(s, 22.8, 23.6)) : ss(s, 21.3, 22.3) * (1 - ss(s, 23.2, 24)); label(g.n, PX, PY - Math.max(g.R * sp / mpp, 4) - 10, a); });
    const nlA = ss(s, 23.4, 24.2) * (1 - ss(s, 26.2, 26.7)); NODES.forEach(n => { if (n.l) { pj(n.x, n.y, n.z); label(n.l, PX, PY - 12, nlA * .9); } });
    const cs = 2 * RU / mpp, cA = ss(s, 25.6, 26.6); pj(0, 0, 0);
    if (cA > .01 && cs < 16000) { ctx.globalAlpha = cA; ctx.drawImage(cmb, PX - cs / 2, PY - cs / 2, cs, cs); ctx.globalAlpha = 1; label('مرز جهان قابل مشاهده', PX, PY + RU / mpp + 22, ss(s, 26.3, 26.9), '#ffc9a0'); }

    // solar system
    const aP = 1 - ss(s, 13.2, 14.4); pj(0, 0, 0); const sx = PX, sy = PY;
    if (aP > .01) {
      PL.forEach(p => orbit(sx, sy, p[1] * AU / mpp, aP));
      if (s < 10.6) { pj(E[0], E[1], 0); orbit(PX, PY, 3.844e8 / mpp, 1); }
      PL.forEach((p, i) => {
        const a = ang(i, t), wx = p[1] * AU * Math.cos(a), wy = p[1] * AU * Math.sin(a); pj(wx, wy, 0); const x = PX, y = PY; if (x < -80 || x > W + 80 || y < -80 || y > H + 80) return;
        const r = p[2] / mpp, dl = Math.hypot(sx - x, sy - y) || 1, lx = (sx - x) / dl, ly = (sy - y) / dl; ctx.globalAlpha = aP;
        if (i === 2) { drawEarth(x, y, r, lx, ly); const ma = t * TAU / 6, mr = 1.737e6 / mpp; pj(wx + 3.844e8 * Math.cos(ma), wy + 3.844e8 * Math.sin(ma), 0);
          ball(PX, PY, mr, '#b9b9b9', lx, ly); label('ماه', PX, PY - Math.max(mr, 2) - 7, ss(s, 8.4, 8.9) * (1 - ss(s, 9.6, 10.2)) * aP); }
        else { ball(x, y, r, p[3], lx, ly); if (i === 5 && r > 4) { ctx.strokeStyle = 'rgba(227,207,154,.7)'; ctx.beginPath(); ctx.ellipse(x, y, r * 2.1, r * 2.1 * sp * .35 + r * .25, -.3, 0, TAU); ctx.stroke(); } }
        ctx.globalAlpha = 1;
        label(p[0], x, y - Math.max(r, 2) - 7, i === 2 ? (ss(s, 8.2, 8.5) * (1 - ss(s, 8.8, 9.3)) + ss(s, 9.6, 10.3) * (1 - ss(s, 13, 13.8))) * aP : ss(p[1] * AU / mpp, 30, 60) * aP);
      });
    }
    const sunR = Math.max(6.96e8 / mpp, 1.6), sunA = 1 - ss(s, 19, 20.5);
    if (sunA > .01 && sx > -4000 && sx < W + 4000) { const gz = (sunR * 5 + 14) * (1 + .04 * Math.sin(t * 2)); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = sunA; ctx.drawImage(GO, sx - gz * 1.6, sy - gz * 1.6, gz * 3.2, gz * 3.2); ctx.drawImage(GW, sx - gz, sy - gz, 2 * gz, 2 * gz);
      ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(sx, sy, sunR, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; label('خورشید', sx, sy - sunR - gz * .35 - 6, aP * ss(s, 10.5, 11.2)); }

    // "we are here" beacon
    const mA = ss(s, 13.6, 15.2); pj(E[0], E[1], 0);
    if (mA > .01) { ctx.strokeStyle = '#7cc4ff'; ctx.lineWidth = 1.4;
      for (let k = 0; k < 3; k++) { const p = (t * .5 + k / 3) % 1; ctx.globalAlpha = mA * (1 - p); ctx.beginPath(); ctx.arc(PX, PY, 5 + p * 34, 0, TAU); ctx.stroke(); }
      ctx.globalAlpha = mA; ctx.fillStyle = '#7cc4ff'; ctx.beginPath(); ctx.arc(PX, PY, 2.5, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; label('ما اینجاییم', PX, PY - 46, mA, '#9cd0ff'); }
  }

  function hud() {
    const li = LV.findIndex(l => s < l[0]);
    if (li !== lvI) { lvI = li; const h = document.querySelector('header'); h.style.opacity = 0; clearTimeout(lvT); lvT = setTimeout(() => { $('name').textContent = LV[li][1]; $('fact').textContent = LV[li][2]; h.style.opacity = 1; }, 260); }
    const m = Math.pow(10, s), [un, uv] = unit(m), sec = m / 3e8, lt = LT.find(x => sec < x[0]);
    $('view').textContent = 'پهنای کادر: ' + fa(m / uv) + ' ' + un + ' · نور این فاصله را در ' + fa(sec / lt[1]) + ' ' + lt[2] + ' می‌پیماید';
    const [bn, bm] = unit(mpp * 90), v = mpp * 90 / bm, p10 = Math.pow(10, Math.floor(Math.log10(v))), k = v / p10, nice = (k < 2 ? 1 : k < 5 ? 2 : 5) * p10;
    $('bar').style.width = nice * bm / mpp + 'px'; $('barL').textContent = fa(nice) + ' ' + bn;
    if (document.activeElement !== sl) sl.value = s;
  }

  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, .05); last = now; t += dt;
    if (auto) { sT = Math.min(SMAX, sT + dt * .42); if (sT >= SMAX) setAuto(false); }
    s += (sT - s) * (1 - Math.exp(-dt * 7));
    draw(); hud(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
